<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Big Wizard">
    <meta name="theme-color" content="#0f0c29">
    
    <title>Big Wizard Media | Client Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { background-color: #050505; color: #f3f4f6; font-family: 'Inter', sans-serif; }
        .font-serif { font-family: 'Cinzel', serif; }
        .glass-nav { background: rgba(15, 12, 41, 0.8); backdrop-filter: blur(10px); }
        .dashboard-gradient { background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); }
        .glass-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(5px); }
        input:focus { outline: 2px solid #9333ea; }
    </style>
</head>
<body class="antialiased min-h-screen">

    <div id="app">
        <!-- Landing Page View -->
        <div id="landing-view">
            <nav class="fixed w-full z-50 glass-nav border-b border-white/10">
                <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
                    <span class="font-serif text-xl font-bold tracking-widest">BIG WIZARD MEDIA</span>
                    <button onclick="showLogin()" class="bg-purple-600 hover:bg-purple-500 px-6 py-2 rounded-full font-medium transition active:scale-95">Client Login</button>
                </div>
            </nav>

            <header class="pt-32 pb-20 text-center px-4">
                <h1 class="text-6xl md:text-8xl font-serif mb-6 leading-tight">Digital <span class="text-purple-400">Magic</span></h1>
                <p class="text-gray-400 max-w-lg mx-auto text-xl">The premium agency for high-end digital solutions.</p>
            </header>
        </div>

        <!-- Dashboard View (Hidden by default) -->
        <div id="dashboard-view" class="hidden min-h-screen p-6 md:p-12 dashboard-gradient">
            <div class="max-w-6xl mx-auto">
                <div class="flex justify-between items-center mb-12">
                    <h2 class="text-3xl font-serif">Hello, <span id="user-display" class="text-purple-400">Wizard</span></h2>
                    <button onclick="logout()" class="text-sm bg-white/10 px-4 py-2 rounded-full hover:bg-white/20 transition">Sign Out</button>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <!-- Project Card -->
                    <div class="glass-card p-8 rounded-2xl transition hover:border-purple-500/50">
                        <h3 class="text-xl font-bold mb-4">Mystic E-Commerce Redesign</h3>
                        <div class="w-full bg-black/50 h-2 rounded-full overflow-hidden">
                            <div class="bg-purple-500 h-full w-[75%]"></div>
                        </div>
                        <p class="mt-4 text-sm text-gray-400">Status: In Development (75%)</p>
                    </div>

                    <div class="glass-card p-8 rounded-2xl transition hover:border-yellow-500/50">
                        <h3 class="text-xl font-bold mb-4">Brand Identity Launch</h3>
                        <div class="w-full bg-black/50 h-2 rounded-full overflow-hidden">
                            <div class="bg-yellow-500 h-full w-[40%]"></div>
                        </div>
                        <p class="mt-4 text-sm text-gray-400">Status: Concept Art (40%)</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Login Modal -->
    <div id="login-modal" class="hidden fixed inset-0 bg-black/90 backdrop-blur-sm flex items-center justify-center z-50 p-4">
        <div class="bg-gray-900 border border-purple-900 p-8 rounded-2xl w-full max-w-sm shadow-2xl">
            <h2 class="text-2xl font-serif mb-6 text-center text-purple-400">Enter The Sanctum</h2>
            <input type="text" id="username" placeholder="Enter your wizard name..." class="w-full bg-black p-4 rounded-xl mb-4 border border-gray-800 text-white placeholder-gray-600">
            <button onclick="login()" class="w-full bg-purple-600 py-4 rounded-xl font-bold hover:bg-purple-500 transition active:scale-95">Unlock Portal</button>
        </div>
    </div>

    <script>
        function showLogin() {
            document.getElementById('login-modal').classList.remove('hidden');
        }

        function login() {
            const user = document.getElementById('username').value;
            if(!user) return;
            
            // Hide login, show dashboard
            document.getElementById('login-modal').classList.add('hidden');
            document.getElementById('landing-view').classList.add('hidden');
            document.getElementById('dashboard-view').classList.remove('hidden');
            document.getElementById('user-display').innerText = user;
            
            // Save state if we wanted to persist
            window.scrollTo(0,0);
        }

        function logout() {
            document.getElementById('landing-view').classList.remove('hidden');
            document.getElementById('dashboard-view').classList.add('hidden');
        }
    </script>
</body>
</html>
